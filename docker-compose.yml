services:

  nginx: 
    build: ./nginx
    ports: 
      - "8443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - tr_network
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend
    networks:
      - tr_network
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
    - "3000:3000"
    expose: 
      - "3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    env_file:
      - .env
    depends_on:
      - database
    networks:
      - tr_network
    restart: always

  database:
    image : postgres:16-alpine
    container_name: database_container
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - tr_network
    restart: always

networks:
  tr_network:

volumes:
  db_data: